name: Deploying to AWS Lightsail (FastAPI + React)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ Correct SSH key setup
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/lightsail_key.pem
          chmod 600 ~/.ssh/lightsail_key.pem

      # ✅ Optional test step (use once to confirm connection works)
      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/lightsail_key.pem ${{ secrets.USERNAME }}@${{ secrets.HOST }} "echo '✅ SSH connected successfully!'"

      - name: Deploy FastAPI & React to Lightsail
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/lightsail_key.pem ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
          cd /home/ubuntu/LeadZen

          echo "Fetching latest changes..."
          git fetch origin main
          git reset --hard origin/main

          echo "Updating backend..."
          cd backend
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate
          pip install -r requirements.txt
          deactivate

          echo "Building frontend..."
          cd ../Frontend
          npm install
          npm run build

          echo "Restarting FastAPI..."
          pkill -f "uvicorn" || true
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

          echo "✅ Deployment successful!"
          EOF
